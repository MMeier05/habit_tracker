[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "habit-tracker"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["typer", "rich"]

[project.scripts]
habit = "main:app"

[tool.setuptools]
py-modules = ["main", "habit", "streak", "ui"]
